name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LiveBackground.sln

      - name: Build (analysers on)
        run: dotnet build LiveBackground.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LiveBackground.sln --configuration Release --no-build --verbosity normal

      # The application users install is produced by build.ps1. Compile the
      # shipping variants with that same script so a change that breaks the
      # shipping build is caught even though the full packaging build (which
      # needs mpv, ffmpeg and Inno Setup) does not run in CI.
      - name: Compile the shipping binaries
        shell: pwsh
        run: ./build.ps1 -CompileOnly -OutDir "$env:RUNNER_TEMP\lb-shipping"
